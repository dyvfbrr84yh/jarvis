<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>JARVIS · Voice Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:radial-gradient(circle at 20% 20%,#0b0f1a,#03050b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.jarvis-card{width:100%;max-width:420px;background:rgba(18,25,40,.65);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border-radius:48px 48px 40px 40px;padding:28px 20px 32px;box-shadow:0 25px 50px -8px #000c,0 0 0 1px #50a0ff26;border:1px solid #64b4ff33}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding:0 4px}.logo-area{display:flex;align-items:center;gap:12px}.logo-icon{background:linear-gradient(145deg,#1a8cff,#0055cc);width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}.title{color:#f0f7ff;font-weight:600;font-size:20px}.title small{font-weight:300;font-size:14px;opacity:.7;margin-left:6px}
.status-badge{background:#00c8ff1f;padding:8px 14px;border-radius:100px;border:1px solid #00b4ff40;color:#b0e0ff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}.status-dot{width:10px;height:10px;border-radius:50%;background:#4cd9ff;box-shadow:0 0 12px #00a6ff}.status-dot.inactive{background:#4a5568;box-shadow:none}
.avatar-section{display:flex;flex-direction:column;align-items:center;margin:12px 0 20px}.jarvis-ring{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}.ring-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#0096ff33,transparent 70%);filter:blur(18px);opacity:.6}.ring-circle{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid #50b4ff40;box-shadow:0 0 30px #0078ff26,inset 0 0 30px #0078ff0d}.ring-circle.active{border-color:#3b9eff;box-shadow:0 0 50px #0080ff55,inset 0 0 40px #0080ff33;animation:pulse-ring 1.6s infinite ease-in-out}@keyframes pulse-ring{0%{transform:scale(1);opacity:.7}50%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:.7}}
.jarvis-avatar{width:110px;height:110px;background:linear-gradient(145deg,#101b2e,#050b16);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;color:#d0eaff;box-shadow:0 8px 30px #000b,0 0 0 1px #2a4c7a;z-index:2}.jarvis-avatar i{filter:drop-shadow(0 0 14px #0088ff77)}.jarvis-avatar.listening i{animation:speak-icon 1s infinite alternate;color:#7fcaff}@keyframes speak-icon{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.08) rotate(2deg);opacity:1}}
.assistant-name{margin-top:16px;color:#b8d6ff;font-weight:400;letter-spacing:2px;font-size:18px;background:#0028504d;padding:6px 24px;border-radius:80px;border:1px solid #1f4970}
.transcript-box{background:#000c1e80;backdrop-filter:blur(8px);border-radius:32px;padding:18px 22px;margin:20px 0 22px;border:1px solid #4696ff26;min-height:80px;box-shadow:inset 0 4px 20px #0006}.transcript-label{font-size:12px;letter-spacing:1.5px;color:#6d8fb0;margin-bottom:6px;display:flex;justify-content:space-between}#transcriptText{color:#ecf7ff;font-size:18px;line-height:1.5;word-break:break-word;min-height:40px}.placeholder-text{opacity:.4;font-style:italic;font-weight:300}
.response-area{background:#00143240;border-radius:24px;padding:12px 18px;margin-bottom:28px;border-left:3px solid #1f6bb0}#responseMessage{color:#cde1ff;font-size:16px;font-weight:300;min-height:28px}
.controls{display:flex;align-items:center;justify-content:center;gap:20px;margin:8px 0 6px}.btn-primary{background:linear-gradient(145deg,#0066dd,#0044aa);border:0;width:80px;height:80px;border-radius:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;box-shadow:0 10px 30px -4px #0033aa80,0 0 0 1px #3b8eff55;cursor:pointer;touch-action:manipulation}.btn-primary:active{transform:scale(.92)}.btn-primary.listening{background:linear-gradient(145deg,#c92f2f,#9e1a1a);box-shadow:0 0 40px #ff4040aa,0 0 0 1px #ff6b6b;animation:pulse-btn 1.4s infinite}@keyframes pulse-btn{0%,100%{box-shadow:0 0 20px #ff3a3a88,0 0 0 1px #ff6b6b}50%{box-shadow:0 0 60px #ff3a3add,0 0 0 2px #ff8a8a}}
.btn-secondary{background:#1e3c6e40;border:1px solid #3865a0;width:54px;height:54px;border-radius:54px;color:#b0d0ff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.btn-secondary:active{transform:scale(.9)}
.footer-meta{display:flex;justify-content:center;margin-top:20px;color:#3d6185;font-size:13px;gap:16px;flex-wrap:wrap}.footer-meta i{margin-right:6px;color:#4d7db0}
.command-hint{margin-top:14px;text-align:center;color:#557da5;font-size:12px;line-height:1.5}.hidden{display:none}
@media(max-width:400px){.jarvis-card{padding:20px 16px}.btn-primary{width:70px;height:70px;font-size:32px}.jarvis-ring{width:130px;height:130px}.jarvis-avatar{width:96px;height:96px;font-size:48px}.title{font-size:18px}}
</style>
</head>
<body>
<div class="jarvis-card" role="main">
<div class="header">
<div class="logo-area"><div class="logo-icon"><i class="fas fa-microchip"></i></div><div class="title">JARVIS <small>v3</small></div></div>
<div class="status-badge"><span class="status-dot" id="statusDot"></span><span id="statusLabel">Standby</span></div>
</div>
<div class="avatar-section">
<div class="jarvis-ring"><div class="ring-glow"></div><div class="ring-circle" id="ringCircle"></div><div class="jarvis-avatar" id="avatarIcon"><i class="fas fa-robot"></i></div></div>
<div class="assistant-name">◆ ONLINE ◆</div>
</div>
<div class="transcript-box">
<div class="transcript-label"><span><i class="fas fa-quote-left" style="opacity:.6"></i> TRANSCRIPT</span><span id="transcriptTime"></span></div>
<div id="transcriptText" class="placeholder-text">Tap the mic and speak...</div>
</div>
<div class="response-area"><div id="responseMessage"><i class="fas fa-comment-dots" style="opacity:.5;margin-right:8px"></i>Awaiting command</div></div>
<div class="controls">
<button class="btn-secondary" id="clearBtn" aria-label="clear"><i class="fas fa-undo-alt"></i></button>
<button class="btn-primary" id="micBtn" aria-label="voice assistant"><i class="fas fa-microphone"></i></button>
<button class="btn-secondary" id="speakBtn" aria-label="speak response"><i class="fas fa-volume-up"></i></button>
</div>
<div class="footer-meta"><span><i class="fas fa-wifi"></i> Web Speech API</span><span><i class="fas fa-mobile-alt"></i> mobile ready</span></div>
<div class="command-hint">Try: “YouTube kholo” · “YouTube par Sholay chalao” · “Google par gold price search karo”</div>
</div>

<script>
(function(){
"use strict";

const micBtn=document.getElementById("micBtn"),clearBtn=document.getElementById("clearBtn"),speakBtn=document.getElementById("speakBtn");
const transcriptText=document.getElementById("transcriptText"),responseMessage=document.getElementById("responseMessage");
const statusDot=document.getElementById("statusDot"),statusLabel=document.getElementById("statusLabel"),ringCircle=document.getElementById("ringCircle"),avatarIcon=document.getElementById("avatarIcon"),transcriptTime=document.getElementById("transcriptTime");
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const synthesis=window.speechSynthesis;
let recognition=null,isListening=false,lastTranscript="",lastResponse="";

function updateUI(active){
 statusDot.className=active?"status-dot":"status-dot inactive";
 statusLabel.textContent=active?"Listening":"Standby";
 ringCircle.classList.toggle("active",active);
 avatarIcon.classList.toggle("listening",active);
 micBtn.classList.toggle("listening",active);
 micBtn.innerHTML=active?'<i class="fas fa-stop"></i>':'<i class="fas fa-microphone"></i>';
}
function setTranscript(text,placeholder=false){
 transcriptText.textContent=text||"—"; transcriptText.className=placeholder?"placeholder-text":"";
 if(text&&text.trim()){lastTranscript=text;transcriptTime.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
}
function setResponse(text){
 responseMessage.innerHTML=text?'<i class="fas fa-comment-dots" style="opacity:.6;margin-right:8px"></i>'+escapeHTML(text):'<i class="fas fa-comment-dots" style="opacity:.5;margin-right:8px"></i>Awaiting command';
 if(text)lastResponse=text;
}
function escapeHTML(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}

function speakResponse(text){
 if(!synthesis||!text)return;
 synthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=1;u.pitch=1;u.volume=1;
 const voices=synthesis.getVoices();
 const v=voices.find(x=>x.lang.toLowerCase().startsWith("en")&&x.name.toLowerCase().includes("google"))||voices.find(x=>x.lang.toLowerCase().startsWith("en"));
 if(v)u.voice=v;synthesis.speak(u);
}

async function requestMic(){
 if(!window.isSecureContext){
  setResponse("Microphone needs HTTPS. Please open JARVIS from an HTTPS website.");
  alert("Microphone needs HTTPS.\n\nCurrent page is not a secure origin. Host this file on an HTTPS website.");
  return false;
 }
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  setResponse("This browser does not provide microphone access.");return false;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  stream.getTracks().forEach(t=>t.stop());
  return true;
 }catch(e){
  console.error(e);
  setResponse(e.name==="NotAllowedError"?"Microphone permission denied. Allow microphone for this site in Chrome.":"Unable to access microphone.");
  alert("Microphone permission denied.\n\nChrome → Site settings → Microphone → Allow");
  return false;
 }
}

function initRecognition(){
 if(!SpeechRecognition){setResponse("Speech Recognition is not supported in this browser.");return false;}
 recognition=new SpeechRecognition();
 recognition.lang="en-US"; // Browser can still understand common Hinglish; change to hi-IN for Hindi-heavy use.
 recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;
 recognition.onstart=()=>{isListening=true;updateUI(true);setTranscript("Listening...",true);};
 recognition.onresult=e=>{
  let interim="",finalText="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   const r=e.results[i]; if(r.isFinal)finalText+=r[0].transcript; else interim+=r[0].transcript;
  }
  if(interim)setTranscript(interim,false);
  if(finalText){setTranscript(finalText,false);processCommand(finalText);try{recognition.stop()}catch(_){}}
 };
 recognition.onerror=e=>{
  console.warn("Speech error:",e.error);isListening=false;updateUI(false);
  if(e.error==="no-speech"){setTranscript("No speech detected. Try again.",true);setResponse("I didn't hear anything, sir.");}
  else if(e.error==="not-allowed")setResponse("Microphone permission denied. Please allow it in Chrome.");
  else setResponse("Speech recognition error: "+e.error);
 };
 recognition.onend=()=>{isListening=false;updateUI(false);};
 return true;
}

function normalize(s){
 return s.toLowerCase().replace(/[“”"']/g,"").replace(/\s+/g," ").trim();
}
function cleanSearchPhrase(s){
 return s
 .replace(/\b(jarvis|youtube|google|search|search karo|search kar do|open|open karo|kholo|khol|chalao|chala|play|lagao|dekho|par|pe|me|mein|do|karo|kar do)\b/gi," ")
 .replace(/\s+/g," ").trim();
}
function openURL(url,reply){
 setResponse(reply);speakResponse(reply);
 setTimeout(()=>{window.location.href=url;},650);
}
function youtubeSearch(q){
 const query=q||"Hindi movie full movie";
 openURL("https://www.youtube.com/results?search_query="+encodeURIComponent(query),"Searching YouTube for "+query+", sir.");
}
function googleSearch(q){
 const query=q||"";
 openURL("https://www.google.com/search?q="+encodeURIComponent(query),"Searching Google for "+query+", sir.");
}

function processCommand(command){
 const l=normalize(command);

 // YouTube: Hindi film/movie
 if(l.includes("youtube") && (l.includes("hindi film")||l.includes("hindi movie"))){
  let q=cleanSearchPhrase(l);
  if(!q||q==="hindi film"||q==="hindi movie")q="Hindi movie full movie";
  youtubeSearch(q);return;
 }

 // YouTube: any requested content
 if(l.includes("youtube")){
  let q=cleanSearchPhrase(l);
  if(q){youtubeSearch(q);return;}
  openURL("https://www.youtube.com/","Opening YouTube, sir.");return;
 }

 // Google/search command
 if(l.includes("google")||l.includes("search karo")||l.includes("search kar do")||l.startsWith("search ")){
  let q=cleanSearchPhrase(l);
  if(q)googleSearch(q);else openURL("https://www.google.com/","Opening Google, sir.");
  return;
 }

 if(l.includes("hello")||l.includes("hi")||l.includes("hey")){
  setResponse("Hello, sir. How can I assist you today?");speakResponse(lastResponse);return;
 }
 if(l.includes("time")||l.includes("clock")){
  const now=new Date();const r="The current time is "+now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+".";setResponse(r);speakResponse(r);return;
 }
 if(l.includes("date")||l.includes("today")){
  const now=new Date();const r="Today is "+now.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";setResponse(r);speakResponse(r);return;
 }
 if(l.includes("your name")||l.includes("who are you")||l.includes("jarvis")){
  const r="I am JARVIS, your personal voice assistant.";setResponse(r);speakResponse(r);return;
 }
 if(l.includes("thank")){
  const r="You are welcome, sir. Always at your service.";setResponse(r);speakResponse(r);return;
 }
 if(l.includes("stop")||l.includes("cancel")){
  if(synthesis)synthesis.cancel();setResponse("Stopping current task, sir.");return;
 }
 const r='I received your command: "'+command+'". I do not have an action for it yet, sir.';
 setResponse(r);speakResponse(r);
}

async function toggleListening(){
 if(isListening){try{recognition.stop()}catch(_){}isListening=false;updateUI(false);return;}
 if(!SpeechRecognition){alert("Speech Recognition is not supported in this browser.");return;}
 const ok=await requestMic();if(!ok)return;
 if(!recognition&&!initRecognition())return;
 try{recognition.start()}catch(e){
  try{recognition.stop()}catch(_){}
  setTimeout(()=>{try{recognition.start()}catch(err){setResponse("Could not start voice recognition. Try again.");updateUI(false);}},300);
 }
}
function clearAll(){
 try{if(recognition)recognition.stop()}catch(_){}
 if(synthesis)synthesis.cancel();isListening=false;updateUI(false);lastTranscript="";lastResponse="";
 setTranscript("Tap the mic and speak...",true);setResponse("");transcriptTime.textContent="";
}
function repeatLast(){speakResponse(lastResponse||"I have no response to repeat, sir.");}

micBtn.addEventListener("click",toggleListening);
clearBtn.addEventListener("click",clearAll);
speakBtn.addEventListener("click",repeatLast);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&isListening){try{recognition.stop()}catch(_){}isListening=false;updateUI(false);}});
updateUI(false);
if(!window.isSecureContext)setResponse("Microphone requires HTTPS. Host this JARVIS page on an HTTPS website.");
})();
</script>
</body>
</html>
